<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifre sıfırla · Tanık</title>
<link rel="stylesheet" href="/static/ds/styles.css">
<style>
  body { background: var(--surface-app); min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  .kutu { width: 100%; max-width: 380px; }
  .marka { display: block; text-align: center; font-family: var(--font-serif);
    font-size: 42px; font-weight: var(--fw-semibold); color: var(--text-strong);
    letter-spacing: var(--track-tight); margin-bottom: var(--space-6); }
  .marka b { color: var(--accent); font-weight: inherit; }
  .kart { background: var(--surface-card); border: 1px solid var(--border-hair);
    border-radius: var(--radius-2); padding: var(--space-6); }
  h1 { font-family: var(--font-serif); font-size: var(--fs-h2); margin: 0 0 var(--space-2); }
  .ipucu { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: var(--space-5);
    line-height: 1.5; }
  label { display: block; font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 5px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: var(--fs-sm);
    padding: 10px 13px; margin-bottom: var(--space-4); border-radius: var(--radius-1);
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-strong); }
  input:focus { outline: none; border-color: var(--accent); }
  input[name=kod] { font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; }
  .btn { width: 100%; font: inherit; font-size: var(--fs-base); font-weight: var(--fw-medium);
    padding: 11px; border-radius: var(--radius-1); cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: var(--text-on-accent); }
  .btn:hover { background: var(--accent-strong); }
  .alt { text-align: center; margin-top: var(--space-5); }
  .alt a { color: var(--text-muted); font-size: var(--fs-sm); text-decoration: none; }
  .alt a:hover { color: var(--accent); }
  .hata { background: #fbeee6; border-left: 3px solid var(--accent); color: var(--text-body);
    font-size: var(--fs-sm); padding: 10px 12px; border-radius: var(--radius-1);
    margin-bottom: var(--space-5); }
</style>
</head>
<body>
  <div class="kutu">
    <div class="marka">Tanık<b>.</b></div>
    <div class="kart">
      <h1>Şifreyi sıfırla</h1>
      <p class="ipucu">Kurtarma kodun kurulumda sunucu loglarında bir kez göründü.
        Onu ve yeni şifreni gir. Sıfırladıktan sonra YENİ bir kurtarma kodu verilir.</p>
      <div id="hata" class="hata" style="display:none">Kurtarma kodu hatalı.</div>
      <form method="POST" action="/reset">
        <label for="kod">Kurtarma kodu</label>
        <input type="text" id="kod" name="kod" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autofocus required>
        <label for="sifre">Yeni şifre</label>
        <input type="password" id="sifre" name="sifre" autocomplete="new-password" minlength="6" required>
        <button class="btn" type="submit">Şifreyi değiştir</button>
      </form>
      <div class="alt"><a href="/login">Girişe dön</a></div>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("hata")) {
      document.getElementById("hata").style.display = "block";
    }
  </script>
</body>
</html>
