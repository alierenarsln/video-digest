<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Tanık</title>
<link rel="stylesheet" href="/static/ds/styles.css">
<style>
  body { background: var(--surface-app); min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  .kutu { width: 100%; max-width: 380px; }
  .marka { display: block; text-align: center; font-family: var(--font-serif);
    font-size: 42px; font-weight: var(--fw-semibold); color: var(--text-strong);
    letter-spacing: var(--track-tight); margin-bottom: var(--space-2); }
  .marka b { color: var(--accent); font-weight: inherit; }
  .slogan { text-align: center; color: var(--text-muted); font-size: var(--fs-sm);
    margin-bottom: var(--space-6); }
  .kart { background: var(--surface-card); border: 1px solid var(--border-hair);
    border-radius: var(--radius-2); padding: var(--space-6); }
  label { display: block; font-size: var(--fs-sm); color: var(--text-muted);
    margin-bottom: 5px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box;
    font: inherit; font-size: var(--fs-sm); padding: 10px 13px; margin-bottom: var(--space-4);
    border-radius: var(--radius-1); border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text-strong); }
  input:focus { outline: none; border-color: var(--accent); }
  .hatirla { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-5);
    font-size: var(--fs-sm); color: var(--text-body); cursor: pointer; }
  .hatirla input { width: auto; margin: 0; }
  .btn { width: 100%; font: inherit; font-size: var(--fs-base); font-weight: var(--fw-medium);
    padding: 11px; border-radius: var(--radius-1); cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: var(--text-on-accent);
    transition: background var(--dur-1) var(--ease-standard); }
  .btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .alt { text-align: center; margin-top: var(--space-5); }
  .alt a { color: var(--text-muted); font-size: var(--fs-sm); text-decoration: none; }
  .alt a:hover { color: var(--accent); }
  .hata { background: var(--sig-uncertain-bg, #fbeee6); border-left: 3px solid var(--accent);
    color: var(--text-body); font-size: var(--fs-sm); padding: 10px 12px;
    border-radius: var(--radius-1); margin-bottom: var(--space-5); }
</style>
</head>
<body>
  <div class="kutu">
    <div class="marka">Tanık<b>.</b></div>
    <div class="slogan">Gezilemeyen bir kaynak. Dürüst bir özet.</div>
    <div class="kart">
      <div id="hata" class="hata" style="display:none">Kullanıcı adı ya da şifre hatalı.</div>
      <form method="POST" action="/login">
        <label for="kullanici">Kullanıcı adı</label>
        <input type="text" id="kullanici" name="kullanici" value="admin" autocomplete="username" autofocus>
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" autocomplete="current-password" required>
        <label class="hatirla">
          <input type="checkbox" name="hatirla" value="1" checked> Beni hatırla
        </label>
        <button class="btn" type="submit">Giriş yap</button>
      </form>
      <div class="alt"><a href="/reset">Şifremi unuttum</a></div>
    </div>
  </div>
  <script>
    // Hata sorgu parametresini göster (POST /login başarısızsa buraya döner).
    if (new URLSearchParams(location.search).has("hata")) {
      document.getElementById("hata").style.display = "block";
    }
  </script>
</body>
</html>
