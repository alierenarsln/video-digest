"Slayt bunu aynen soyler ve sahiplik (endowment) etkisini bu kuralin ihlali olarak tanimlar: satici degeri sisirince beklenenden fazla 'satis olmadi' durumu dogar.","a":true},{"k":"tf","t":"UTL","n":"INE4307-Utility · Decreasing and Constant Risk Aversion · s.48, 50","q":"Under decreasing risk aversion, adding a constant amount to all payoffs of a gamble INCREASES the risk premium.","e":"Azalan risk kacinmasinda tum odemelere sabit eklenince risk primi AZALIR. Slayttaki ln tablosu bunu gosterir: 10-40 oyununda RP=5 iken 40-70 oyununda RP=2.08'e duser.","a":false},{"k":"tf","t":"UTL","n":"INE4307-Utility · Axioms for Expected Utility (7. Finiteness) · s.65","q":"The finiteness axiom states that no consequence is considered infinitely good or infinitely bad, which assures that expected utility is never infinite.","e":"Sonluluk aksiyomu tam olarak bunu soyler. Slayt, bu sayede beklenen faydanin hicbir zaman sonsuz olmayacagini ve anlamli karsilastirma yapilabilecegini ekler.","a":true},{"k":"tf","t":"UTL","n":"INE4307-Utility · Allais Paradox · s.77-79","q":"The Allais paradox demonstrates that choosing A over B and D over C is fully consistent with expected utility theory.","e":"Slayt bu iki secimin CELISKI urettigini gosterir: A>B ise 0.11U(1M) > 0.1U(5M)+0.01U(0), D>C ise ayni ifade ters yonde cikar. Kaynak olarak kesinlik (certainty) etkisi gosterilir.","a":false},{"k":"mc","t":"UTL","n":"INE4307-Utility · Alternate CE Calculations · s.41-42","q":"A lottery pays 2000, 1000 and 500 with probabilities 0.4, 0.4 and 0.2. Its mean is 1300 and its variance is 360,000. Using Pratt's approximation with a risk tolerance of R = $900, what is the certainty equivalent?","e":"CE = 1300 - 0.5(360000/900) = 1300 - 200 = 1100. 1300 secilirse risk primi hic dusulmemis (risk notr) olur; 900 ise R degerinin kendisidir.","o":["$1,100","$1,300","$900","$700"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Decreasing and Constant Risk Aversion · s.49","q":"A gamble pays $10 or $40, each with probability 0.5. The decision maker has U(x) = ln(x). Given ln(10) = 2.3026 and ln(40) = 3.6889, what is the certainty equivalent?","e":"EU = 0.5(2.3026)+0.5(3.6889) = 2.9957 ve CE = e^2.9957 = 20. $25 EMV'dir; log fayda icbukey oldugu icin CE mutlaka EMV'nin altinda kalir.","o":["$20","$25","$15","$30"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Decreasing and Constant Risk Aversion · s.49","q":"For the same 50-50 gamble of $10 vs $40 with U(x) = ln(x), where EMV = $25 and CE = $20, what is the risk premium?","e":"RP = EMV - CE = 25 - 20 = 5 > 0 oldugundan karar verici riskten kacinandir; kesin $20'yi kumara esdeger gorup $5'lik farktan vazgecer.","o":["$5, indicating a risk-averse decision maker","-$5, indicating a risk-seeking decision maker","$0, indicating a risk-neutral decision maker","$20, equal to the certainty equivalent"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Decreasing and Constant Risk Aversion · s.50-51","q":"With U(x) = ln(x), the risk premiums for the 50-50 gambles 10-40, 20-50, 30-60 and 40-70 are 5.00, 3.38, 2.57 and 2.08 respectively. What does this pattern show?","e":"Her oyunda odemelere ayni sabit ekleniyor ama RP surekli dusuyor; bu azalan risk kacinmasinin tanimidir (slayt: para arttikca ayni bahis daha az tedirgin eder).","o":["Decreasing risk aversion: adding a constant to all payoffs lowers the risk premium","Constant risk aversion: the risk premium is unaffected by the payoff level","Increasing risk aversion: the decision maker gets more nervous as payoffs rise","Risk neutrality: the decision maker ignores variability altogether"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Decreasing and Constant Risk Aversion · s.53-54","q":"With U(x) = 1 - e^(-x/R), the risk premium for the 50-50 gambles 10-40, 20-50, 30-60 and 40-70 is 3.12 in every case. What does this illustrate?","e":"Ustel fayda sabit risk kacinmasi tasir: odemelere sabit eklemek RP'yi degistirmez, yani karar verme servetten (ya da servetsizlikten) etkilenmez.","o":["Constant risk aversion: the risk premium does not depend on the decision maker's initial wealth","Decreasing risk aversion: wealthier decision makers demand a smaller premium","That the exponential utility function is risk neutral","That the exponential utility function is only valid for small payoffs"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Endowment Effect · s.45","q":"Which statement best defines the endowment effect?","e":"Sahiplik etkisi satici tarafinda degeri sisirir ve teoriden beklenenden fazla 'satis olmadi' sonucu dogurur. Diger secenekler sirasiyla tercih tersinmesi, kesinlik etkisi ve prosedur degismezligi ihlalidir.","o":["Sellers overestimate the value of goods they own and set the minimum selling price too high","Decision makers choose the lottery with the lower certainty equivalent","Decision makers put too much weight on an outcome that is certain","Different elicitation procedures give different measurements of the same preference"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Pitfalls in Utility Assessment: Biases · s.43","q":"The principle that the CE method, the PE method or any other assessment method should not bias the shape of the assessed utility function is called:","e":"Prosedur degismezligi: ayni olguyu olcen farkli yontemler ayni olcumu vermelidir. Slayt arastirmanin bunun boyle olmadigini gosterdigini ekler.","o":["Procedure invariance","Monotonicity","Substitutability","Reduction of compound uncertain events"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Axioms for Expected Utility (2. Reduction) · s.58-59","q":"Which axiom states that a decision maker is indifferent between a compound uncertain event and the simple uncertain event obtained from it by standard probability manipulations?","e":"Indirgeme aksiyomu, iki asamali sansi (p sonra q) tek asamaya (pq) cevirmenin tercihleri degistirmedigini soyler; slayttaki iki karar agaci bunu gosterir.","o":["Reduction of compound uncertain events","Substitutability","Continuity","Invariance"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Axioms for Expected Utility (3. Continuity) · s.60","q":"For consequences with A1 > A > A2, we can always find a probability p (0 < p < 1) such that the decision maker is indifferent between A for sure and a gamble giving A1 with probability p and A2 with probability 1 - p. Which axiom is this?","e":"Sureklilik aksiyomu, her ara sonuca esdeger bir referans kumar kurulabilmesini garanti eder; fayda olcumunun temeli budur.","o":["Continuity","Monotonicity","Finiteness","Ordering and transitivity"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Equivalent under Utility Axioms · s.66-68","q":"In the classroom example, lottery A gives a 0.5 chance at $20 and a 0.5 chance at $15. The decision maker is indifferent between $20 and a reference gamble paying $40 with probability 0.60, and between $15 and a reference gamble paying $40 with probability 0.36. After substitution and reduction, what is A's overall probability of winning $40?","e":"0.5(0.60) + 0.5(0.36) = 0.48; bileske sans tek asamaya indirgenir. B'nin karsiligi 0.30 oldugundan monotonluk A'nin tercih edildigini soyler.","o":["0.48","0.96","0.50","0.36"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Example / Paradoxes · s.72-74","q":"In the Asian disease example, most people prefer the sure Program A when outcomes are framed as lives saved, but prefer the risky Program D when the identical outcomes are framed as deaths. What explains this?","e":"A ile C ayni sonucu (400 kurtulur = 200 olur), B ile D ayni kumari tanimlar; degisen tek sey referans noktasidir. Slayt: kazanc cercevesinde riskten kacinilir, kayip cercevesinde risk aranir (prospect theory).","o":["Framing shifts the reference point, and people are risk-averse for gains but risk-seeking for losses","People simply miscalculate the expected number of survivors in one of the two frames","The two frames describe genuinely different programs, so the choices are consistent","The certainty effect makes the risky option more attractive in both frames"]},{"k":"mc","t":"UTL","n":"INE4307-Utility · Allais Paradox / Certainty Effect · s.77-79","q":"In the Allais paradox, preferring A (a sure $1 million) to B, while also preferring D to C, produces a logical contradiction. Which effect is given as the source of this inconsistency?","e":"Karar 1'de kesin 1M var, Karar 2'de her iki secenek de belirsiz; kesinlige asiri agirlik verilmesi ayni fayda esitsizliginin iki karsit yonde cikmasina yol acar.","o":["Certainty effect: too much weight is placed on a certain outcome relative to uncertain ones","Endowment effect: the sure $1 million is treated as already owned","Reflection effect: losses loom larger than equivalent gains","Procedure invariance: the two decisions were elicited with different methods"]}];
/* ==== /BANK ==== */

const TOPICS = [
  {id:"L1&2", label:"Introduction & Influence Diagrams", match:/^L1&2/i},
  {id:"L3&4", label:"Decision Trees, Risk Profiles, Dominance", match:/^L3&4/i},
  {id:"L5&6", label:"Sensitivity Analysis & Probability", match:/^L5&6/i},
  {id:"VOI",  label:"Value of Information", match:/^VOI/i},
  {id:"UTL",  label:"Utility & Risk Attitudes", match:/^(UTL|Utility)/i},
];
function topicOf(q){
  const t = TOPICS.find(t=>t.match.test(q.n||""));
  return t ? t.id : "L1&2";
}
BANK.forEach((q,i)=>{ q._i=i; q._t=q.t || topicOf(q); });

const store = {
  get(k,d){ try{ const v=localStorage.getItem("ine4307:"+k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem("ine4307:"+k, JSON.stringify(v)); }catch(e){} },
};

let sel = { kinds:new Set(store.get("kinds",["tf","mc"])), topics:new Set(store.get("topics",TOPICS.map(t=>t.id))) };
let queue=[], pos=0, right=0, wrong=[], answered=false, wrongOnly=false;

const app = document.getElementById("app");
const foot = document.getElementById("foot");
const sPos = document.getElementById("sPos");
const sAcc = document.getElementById("sAcc");
const pbar = document.getElementById("pbar");

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function pool(){
  return BANK.filter(q=>sel.kinds.has(q.k) && sel.topics.has(q._t));
}

function setBar(){
  if(!queue.length){ sPos.textContent="—"; sAcc.textContent=""; pbar.style.width="0%"; return; }
  sPos.textContent = `${Math.min(pos+1,queue.length)} / ${queue.length}`;
  const done = pos + (answered?1:0);
  sAcc.innerHTML = done ? `accuracy <b>${Math.round(right/done*100)}%</b>` : "";
  pbar.style.width = (done/queue.length*100).toFixed(1)+"%";
}

/* ---------------- setup ---------------- */
function renderSetup(){
  const counts = {};
  TOPICS.forEach(t=>counts[t.id]=BANK.filter(q=>q._t===t.id).length);
  const tfN = BANK.filter(q=>q.k==="tf").length;
  const mcN = BANK.filter(q=>q.k==="mc").length;
  const n = pool().length;

  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">31 August · 10:30 · D-305</div>
      <h1>Part A &amp; Part B, ${BANK.length} questions deep</h1>
      <p class="lede">Every question is drawn from the lecture slides. Answer, see whether you were right, and read why before moving on. Wrong answers are collected so you can run them again.</p>
    </div>

    <div class="panel">
      <h2>Question type</h2>
      <div class="opts" id="kinds">
        <button class="chip" data-k="tf" aria-pressed="${sel.kinds.has("tf")}">True / False <span class="ct">${tfN}</span></button>
        <button class="chip" data-k="mc" aria-pressed="${sel.kinds.has("mc")}">Multiple choice <span class="ct">${mcN}</span></button>
      </div>
    </div>

    <div class="panel">
      <h2>Topics</h2>
      <div class="opts" id="topics">
        ${TOPICS.map(t=>`<button class="chip" data-t="${t.id}" aria-pressed="${sel.topics.has(t.id)}">${esc(t.label)} <span class="ct">${counts[t.id]}</span></button>`).join("")}
      </div>
    </div>

    <button class="start" id="go" ${n?"":"disabled"}>${n?`Start · ${n} questions`:"Choose at least one type and topic"}</button>
    <div class="hint">Keys — <kbd>1</kbd>…<kbd>4</kbd> answer · <kbd>T</kbd>/<kbd>F</kbd> true or false · <kbd>Enter</kbd> next</div>
  `;
  foot.innerHTML = `Questions are generated from the INE4307 lecture decks and cross-checked against them. Explanations are in Turkish. Nothing here is an official exam paper.`;

  app.querySelectorAll("#kinds .chip").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; sel.kinds.has(k)?sel.kinds.delete(k):sel.kinds.add(k);
    store.set("kinds",[...sel.kinds]); renderSetup();
  });
  app.querySelectorAll("#topics .chip").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; sel.topics.has(t)?sel.topics.delete(t):sel.topics.add(t);
    store.set("topics",[...sel.topics]); renderSetup();
  });
  const go=document.getElementById("go");
  if(go) go.onclick=()=>begin(shuffle(pool()),false);
  setBar();
}

function begin(list, isRetry){
  queue=list; pos=0; right=0; wrong=[]; answered=false; wrongOnly=isRetry;
  foot.innerHTML="";
  renderQ();
}

/* ---------------- question ---------------- */
function renderQ(){
  const q=queue[pos];
  answered=false;
  const isTF = q.k==="tf";
  const opts = isTF
    ? [{txt:"True", ok:q.a===true},{txt:"False", ok:q.a===false}]
    : shuffle(q.o.map((t,i)=>({txt:t, ok:i===0})));

  app.innerHTML = `
    <div class="qhead">
      <span class="kind">${isTF?"True / False":"Multiple choice"}</span>
      <span class="src">${esc(q.n||"")}</span>
    </div>
    <p class="q">${esc(q.q)}</p>
    <div class="choices" id="ch">
      ${opts.map((o,i)=>`<button class="choice" data-i="${i}" data-ok="${o.ok}">
         <span class="key">${isTF?(i===0?"T":"F"):String.fromCharCode(65+i)}</span>
         <span>${esc(o.txt)}</span></button>`).join("")}
    </div>
    <div id="after"></div>
  `;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(b, opts));
  setBar();
  window.scrollTo({top:0,behavior:"instant"});
}

function pick(btn, opts){
  if(answered) return;
  answered=true;
  const q=queue[pos];
  const ok = btn.dataset.ok==="true";
  if(ok) right++; else wrong.push(q);

  app.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    const bok=b.dataset.ok==="true";
    if(b===btn) b.classList.add(ok?"pick-ok":"pick-bad");
    else if(bok) b.classList.add("reveal");
    else b.classList.add("dim");
  });

  const correctTxt = opts.find(o=>o.ok).txt;
  document.getElementById("after").innerHTML = `
    <div class="fb ${ok?"ok":"bad"}">
      <div class="verdict">${ok?"Doğru":"Yanlış — doğrusu: "+esc(correctTxt)}</div>
      <div class="body">${esc(q.e||"")}</div>
    </div>
    <div class="nav">
      <button class="next" id="next">${pos+1<queue.length?"Next question":"See results"}</button>
      <button class="ghost" id="quit">End</button>
    </div>
  `;
  document.getElementById("next").onclick=advance;
  document.getElementById("quit").onclick=results;
  document.getElementById("next").focus();
  setBar();
}

function advance(){
  if(pos+1<queue.length){ pos++; renderQ(); } else results();
}

/* ---------------- results ---------------- */
function results(){
  const done = pos + (answered?1:0);
  const pct = done? Math.round(right/done*100) : 0;
  const seen = queue.slice(0, done);
  const byT = {};
  seen.forEach(q=>{ (byT[q._t] ||= {n:0,r:0}).n++; });
  seen.forEach(q=>{ if(!wrong.includes(q)) byT[q._t].r++; });

  const rows = TOPICS.filter(t=>byT[t.id]).map(t=>{
    const d=byT[t.id]; const p=Math.round(d.r/d.n*100);
    const col = p>=80?"var(--ok)":p>=55?"var(--stat)":"var(--bad)";
    return `<div class="trow">
      <span class="tname">${esc(t.label)}</span>
      <span class="tpct" style="color:${col}">${p}%</span>
      <span class="tbar"><i style="width:${p}%;background:${col}"></i></span>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">${wrongOnly?"Retry round":"Session complete"}</div>
      <div class="score-big">${right}<span style="color:var(--ink-3)">/${done}</span></div>
      <div class="score-sub">${pct}% correct${wrong.length?` · ${wrong.length} to review`:" · nothing missed"}</div>
    </div>
    ${rows?`<div class="panel"><h2>Accuracy by topic</h2>${rows}</div>`:""}
    ${wrong.length?`<button class="start" id="again">Run the ${wrong.length} I missed</button>`:""}
    <div class="nav" style="margin-top:12px">
      <button class="ghost" id="home" style="flex:1">Back to setup</button>
    </div>
  `;
  const a=document.getElementById("again");
  if(a) a.onclick=()=>begin(shuffle(wrong.slice()),true);
  document.getElementById("home").onclick=renderSetup;
  foot.innerHTML = wrong.length
    ? `Weakest topic first. A topic under 55% is worth re-reading in the slides before drilling it again.`
    : ``;
  pbar.style.width="100%";
}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const chs=[...document.querySelectorAll(".choice")];
  if(!answered && chs.length){
    const q=queue[pos];
    if(q && q.k==="tf"){
      if(/^t$/i.test(e.key)){ chs[0].click(); e.preventDefault(); return; }
      if(/^f$/i.test(e.key)){ chs[1].click(); e.preventDefault(); return; }
    }
    const n=parseInt(e.key,10);
    if(n>=1 && n<=chs.length){ chs[n-1].click(); e.preventDefault(); return; }
    if(/^[a-d]$/i.test(e.key)){
      const i="abcd".indexOf(e.key.toLowerCase());
      if(i<chs.length){ chs[i].click(); e.preventDefault(); }
      return;
    }
  }
  if(answered && (e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){
    const nx=document.getElementById("next"); if(nx){ nx.click(); e.preventDefault(); }
  }
});

renderSetup();
</script>
